# Bridge-V continuous integration (P0.8). Mirrors what a contributor runs locally:
# fmt, clippy, guest builds, reference checks, cargo test.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host packages (tools/setup.sh)
        run: ./tools/setup.sh

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install 1.94 --profile minimal --component rustfmt,clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy (--features disasm)
        run: cargo clippy --all-targets --features disasm -- -D warnings

      - name: Build guest programs
        run: ./tools/build-guests.sh

      - name: Check guests against qemu-riscv64 reference outputs
        run: ./tools/ref-check.sh

      - name: Build riscv-tests (needed by tests/riscv_tests.rs)
        run: ./tools/build-riscv-tests.sh

      - name: cargo test
        run: cargo test
        env:
          BRIDGEV_REQUIRE_GUESTS: "1"
          # Fixed seed for the property tests (ir_passes, fuzz_blocks): reproducible CI runs.
          PROPTEST_RNG_SEED: "20260926"

  riscv-tests:
    name: riscv-tests (build + qemu reference)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host packages (tools/setup.sh)
        run: ./tools/setup.sh

      - name: riscv-tests revision
        id: rev
        run: echo "rev=$(git -C third_party/riscv-tests rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: guest/build/riscv-tests
          key: riscv-tests-${{ steps.rev.outputs.rev }}-${{ hashFiles('tools/build-riscv-tests.sh') }}

      - name: Build riscv-tests
        run: |
          if [ ! -d guest/build/riscv-tests ]; then ./tools/build-riscv-tests.sh; fi
          ls guest/build/riscv-tests | wc -l

      - name: Run riscv-tests under qemu (reference)
        run: ./tools/ref-riscv-tests.sh

  linux-boot:
    name: Linux boot to a BusyBox shell (Milestone B)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install 1.94 --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - uses: actions/cache@v4
        with:
          path: guest/build/linux/deb
          key: linux-debs-${{ hashFiles('tools/fetch-guest-images.sh') }}

      - name: Install QEMU's OpenSBI (qemu-system-data) for the --firmware boot
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends qemu-system-data

      - name: Fetch guest images (Ubuntu riscv64 kernel + busybox-static, pinned SHA256)
        run: cargo build --release && ./tools/fetch-guest-images.sh

      - name: Boot, run shell commands over the UART, power off (jit, interp, lockstep; built-in SBI and OpenSBI)
        run: cargo test --release --test linux_boot -- --ignored --test-threads 1

